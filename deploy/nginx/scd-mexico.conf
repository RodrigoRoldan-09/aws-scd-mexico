# AWS Student Community Day México — reverse proxy de Next.js (puerto 2000)
#
# Reemplaza DOMINIO por el dominio real en server_name y en las rutas del
# certificado. El puerto tiene que coincidir con el de ecosystem.config.cjs.
#
# SSL pensado para Cloudflare en modo Full (strict): el .pem y el .key son el
# origin certificate de Cloudflare, guardados en /etc/ssl/.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO www.DOMINIO;

    ssl_certificate     /etc/ssl/DOMINIO.pem;
    ssl_certificate_key /etc/ssl/DOMINIO.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # /api/admin/upload-slide recibe la plantilla del certificado por el
    # servidor (no va directo a S3) y acepta hasta 50 MB. El default de nginx
    # es 1 MB y respondería 413.
    client_max_body_size 55M;

    location /_next/static/ {
        proxy_pass http://localhost:2000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:2000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
