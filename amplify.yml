version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo MONGODB_URI=$MONGODB_URI >> .env.production
        - echo JWT_SECRET=$JWT_SECRET >> .env.production
        - echo NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL >> .env.production
        - echo S3_BUCKET=$S3_BUCKET >> .env.production
        - echo S3_PUBLIC_URL=$S3_PUBLIC_URL >> .env.production
        - echo RESEND_API_KEY=$RESEND_API_KEY >> .env.production
        - echo EMAIL_FROM=$EMAIL_FROM >> .env.production
        - echo APP_AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID >> .env.production
        - echo APP_AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
